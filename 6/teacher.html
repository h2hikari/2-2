<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카드 뽑기 — 교사용</title>

<!--
  ┌──────────────────────────────────────────────────────────────┐
  │  교사용 페이지                                                │
  │                                                              │
  │  학생용 card.html 과 같은 폴더에 두세요.                      │
  │  세트를 골라 체크하면 학생용 주소가 만들어집니다.             │
  │  그 주소를 확장 프로그램으로 QR로 바꿔 띄우시면 됩니다.       │
  │                                                              │
  │  아래 두 줄은 card.html 과 똑같이 맞춰 주세요.                │
  └──────────────────────────────────────────────────────────────┘
-->
<script>
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTIwNZk2gTYyVEhjt9GvVDFH6mxYPfilk6TQQZd_hjcn0iV-VLyopvBcLTYyEbYHwPjQULHhQWo-Hp2/pubhtml';        // card.html 과 같은 값
  const STUDENT_PAGE  = 'card.html';
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ai:#16313F; --ai-2:#1F4457; --ai-3:#27526A;
    --kinari:#F2EADA; --kinari-2:#E4D9C2;
    --shu:#C8452C; --moegi:#7FA05E;
    --edge:rgba(242,234,218,.22);
    --jp:"Noto Serif JP",'Yu Mincho',serif;
    --kr:"Noto Sans KR",'Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--ai); color:var(--kinari);
    font-family:var(--kr); font-size:16px; line-height:1.6;
    padding:28px 20px 60px;
  }
  .wrap{max-width:820px; margin:0 auto}

  h1{font-family:var(--jp); font-size:26px; font-weight:700; margin:0 0 4px}
  h1 span{font-family:var(--kr); font-size:13px; font-weight:400; opacity:.6; margin-left:10px}
  .lead{opacity:.62; font-size:14px; margin:0 0 26px}

  h2{
    font-size:14px; font-weight:700; letter-spacing:.08em; opacity:.65;
    margin:30px 0 12px; padding-bottom:7px; border-bottom:1px solid var(--edge);
  }

  /* 세트 목록 */
  .sets{display:grid; grid-template-columns:1fr 1fr; gap:9px}
  @media (max-width:640px){ .sets{grid-template-columns:1fr} }
  .set{
    display:flex; align-items:center; gap:11px;
    background:var(--ai-2); border:1px solid var(--edge); border-radius:3px;
    padding:12px 14px; cursor:pointer; min-height:56px;
    transition:background .12s;
  }
  .set:hover{background:var(--ai-3)}
  .set.on{background:var(--kinari); color:#23201C; border-color:var(--kinari)}
  .set input{width:18px; height:18px; accent-color:var(--shu); flex:none; cursor:pointer}
  .set .nm{font-size:15px; font-weight:500; line-height:1.3}
  .set .ct{margin-left:auto; font-size:12px; opacity:.55; white-space:nowrap}
  .set.on .ct{opacity:.5}

  /* 옵션 */
  .opts{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
  .opt{
    display:flex; align-items:center; gap:9px;
    background:var(--ai-2); border:1px solid var(--edge); border-radius:3px;
    padding:10px 14px; cursor:pointer; min-height:48px; font-size:14px;
  }
  .opt.on{background:var(--kinari); color:#23201C; border-color:var(--kinari); font-weight:700}
  .opt input{width:17px; height:17px; accent-color:var(--shu); cursor:pointer}
  .opt select{
    background:var(--ai-2); color:var(--kinari); border:1px solid var(--edge);
    border-radius:3px; padding:9px 12px; font-family:var(--kr); font-size:14px; min-height:48px;
  }

  /* 결과 주소 */
  .out{
    background:var(--ai-2); border-left:4px solid var(--shu);
    padding:16px 18px; margin-top:14px; border-radius:0 3px 3px 0;
  }
  .out code{
    display:block; font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:14px; line-height:1.55; word-break:break-all; color:#F4EFE2;
  }
  .btns{display:flex; gap:9px; margin-top:14px; flex-wrap:wrap}
  .btn{
    font-family:var(--kr); font-size:15px; font-weight:700;
    background:var(--kinari); color:#23201C; border:none; border-radius:3px;
    padding:12px 22px; min-height:48px; cursor:pointer;
  }
  .btn.ghost{background:transparent; color:var(--kinari); border:1px solid var(--edge); font-weight:500}
  .btn.shu{background:var(--shu); color:#fff}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible,.set:focus-within,.opt:focus-within{outline:3px solid #8FC0D8; outline-offset:2px}

  /* 저장한 조합 */
  .saved{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    display:flex; align-items:center; gap:8px;
    background:var(--ai-2); border:1px solid var(--edge); border-radius:20px;
    padding:8px 8px 8px 15px; font-size:14px;
  }
  .chip b{font-weight:500; cursor:pointer}
  .chip .x{
    background:none; border:none; color:var(--kinari); opacity:.45;
    font-size:17px; line-height:1; cursor:pointer; padding:3px 7px;
  }
  .chip .x:hover{opacity:1; color:#F09A86}

  .msg{font-size:13px; opacity:.55; margin-top:10px}
  .msg.err{color:#F09A86; opacity:.95}
  .empty{opacity:.5; font-size:14px; padding:14px 0}
</style>
</head>

<body>
<div class="wrap">

  <h1>カード<span>카드 뽑기 · 교사용</span></h1>
  <p class="lead">오늘 쓸 세트를 고르면 학생용 주소가 만들어집니다. 주소를 확장 프로그램으로 QR로 바꿔 띄우세요.</p>

  <h2>1 · 세트 고르기</h2>
  <div class="sets" id="sets"><div class="empty">불러오는 중…</div></div>
  <div class="btns" style="margin-top:12px">
    <button class="btn ghost" id="all">전체 선택</button>
    <button class="btn ghost" id="none">전체 해제</button>
  </div>

  <h2>2 · 옵션</h2>
  <div class="opts">
    <label class="opt" id="yomiWrap">
      <input type="checkbox" id="yomiOff">
      <span>발음을 숨긴 채로 시작</span>
    </label>
    <label class="opt">
      <span>한 판에</span>
      <select id="round">
        <option value="">기본 (8장)</option>
        <option value="4">4장</option>
        <option value="6">6장</option>
        <option value="8">8장</option>
        <option value="10">10장</option>
        <option value="12">12장</option>
        <option value="99">전부</option>
      </select>
    </label>
  </div>

  <h2>3 · 학생용 주소</h2>
  <div class="out"><code id="url">—</code></div>
  <div class="btns">
    <button class="btn shu" id="copy">주소 복사</button>
    <button class="btn" id="open">미리 보기</button>
    <button class="btn ghost" id="save">이 조합 저장</button>
  </div>
  <p class="msg" id="msg"></p>

  <h2>4 · 저장한 조합</h2>
  <div class="saved" id="saved"></div>

</div>

<script>
/* ── 내장 세트 목록 ──
   card.html 이나 시트를 읽지 못해도 이 목록으로 동작합니다.
   세트를 새로 만드시면 여기에 한 줄 추가해 주세요.  '세트 이름': 카드 장수  */
const SET_LIST = {
  '5과 · 활동 카드': 36,
  '3차시 · 교과서 음식': 11,
  '5과 2차시 · 주문 참사': 12,
  '5과 2차시 · 헷갈리는 짝': 8,
  '5과 · 총정리': 12,
  '6과 맛보기 · どっちが 早い？': 12,
  '6과 맛보기 · どっちが 安い？': 12,
  '6과 · ないで 제지하기': 8,
  '6과 · ても いいですか': 12
};

let SETS = [];

const $ = id => document.getElementById(id);
const msg = (t, err) => { const m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (err ? ' err' : ''); };

function parseCSV(text){
  const out=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); out.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c;
  }
  if(cell.length||row.length){ row.push(cell); out.push(row); }
  return out.filter(r=>r.some(v=>v.trim()!==''));
}

/* 세트 목록 모으기 : 시트 → card.html → 내장 목록 */
async function collect(){
  // 1) 구글 시트
  if(SHEET_CSV_URL){
    try{
      const res = await fetch(SHEET_CSV_URL);
      if(!res.ok) throw 0;
      const tb = parseCSV(await res.text());
      const head = tb[0].map(h=>h.trim().toLowerCase());
      const si = head.indexOf('set'), ti = head.indexOf('type');
      const counts = {};
      tb.slice(1).forEach(r=>{
        const nm = (r[si]||'').trim(); const tp = (r[ti]||'').trim();
        if(!nm || tp.indexOf('template') === 0) return;
        counts[nm] = (counts[nm]||0) + 1;
      });
      if(Object.keys(counts).length){
        msg('시트에서 세트 ' + Object.keys(counts).length + '개를 불러왔습니다.');
        return counts;
      }
    }catch(e){ /* 다음으로 */ }
  }

  // 2) 같은 폴더의 학생용 페이지
  try{
    const res = await fetch(STUDENT_PAGE, { cache: 'no-store' });
    if(!res.ok) throw 0;
    const txt = (await res.text()).replace(/\r/g, '');
    const i = txt.indexOf('BUILTIN');
    if(i < 0) throw 0;
    const end = txt.indexOf('\n];', i);
    const body = txt.slice(i, end < 0 ? undefined : end);
    const counts = {};
    const re = /\[\s*'([^']*)'\s*,\s*'([^']*)'/g;
    let m;
    while((m = re.exec(body)) !== null){
      if(m[2].indexOf('template') === 0) continue;
      if(!['food','tool','a','b','pile1','pile2'].includes(m[2])) continue;
      counts[m[1]] = (counts[m[1]]||0) + 1;
    }
    if(Object.keys(counts).length){
      msg(STUDENT_PAGE + ' 에서 세트 ' + Object.keys(counts).length + '개를 읽었습니다.');
      return counts;
    }
  }catch(e){ /* 다음으로 */ }

  // 3) 내장 목록
  msg('이 페이지에 적어 둔 목록으로 표시합니다. (' + Object.keys(SET_LIST).length + '개)');
  return Object.assign({}, SET_LIST);
}

function drawSets(counts){
  SETS = Object.keys(counts);
  const box = $('sets');
  if(!SETS.length){ box.innerHTML = '<div class="empty">세트가 없습니다.</div>'; return; }
  box.innerHTML = SETS.map((nm,i)=>`
    <label class="set" data-i="${i}">
      <input type="checkbox" value="${nm.replace(/"/g,'&quot;')}">
      <span class="nm">${nm}</span>
      <span class="ct">${counts[nm]}장</span>
    </label>`).join('');
  box.querySelectorAll('input').forEach(c=>{
    c.addEventListener('change', ()=>{ c.closest('.set').classList.toggle('on', c.checked); build(); });
  });
}

function picked(){
  return [...document.querySelectorAll('#sets input:checked')].map(c=>c.value);
}

function build(){
  const base = new URL(STUDENT_PAGE, location.href).href;
  const p = new URLSearchParams();
  const sel = picked();
  // 전부 고르거나 하나도 안 고르면 조건 없이
  if(sel.length && sel.length !== SETS.length) p.set('set', sel.join(','));
  if($('yomiOff').checked) p.set('yomi','off');
  const n = $('round').value;
  if(n) p.set('n', n);
  const url = p.toString() ? base + '?' + p.toString() : base;
  $('url').textContent = decodeURIComponent(url);
  return url;
}

/* ── 저장한 조합 ── */
const KEY = 'cardTeacherPresets';
const load = () => { try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } };
const store = v => { try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} };

function drawSaved(){
  const list = load();
  const box = $('saved');
  if(!list.length){ box.innerHTML = '<div class="empty">아직 저장한 조합이 없습니다.</div>'; return; }
  box.innerHTML = list.map((v,i)=>`
    <span class="chip"><b data-i="${i}">${v.name}</b><button class="x" data-del="${i}">×</button></span>`).join('');
  box.querySelectorAll('b').forEach(b=>{
    b.onclick = () => {
      const v = load()[+b.dataset.i];
      document.querySelectorAll('#sets input').forEach(c=>{
        c.checked = v.sets.includes(c.value);
        c.closest('.set').classList.toggle('on', c.checked);
      });
      $('yomiOff').checked = !!v.yomi;
      $('yomiWrap').classList.toggle('on', !!v.yomi);
      $('round').value = v.n || '';
      build();
      msg('「' + v.name + '」 을 불러왔습니다.');
    };
  });
  box.querySelectorAll('[data-del]').forEach(x=>{
    x.onclick = () => { const l = load(); l.splice(+x.dataset.del, 1); store(l); drawSaved(); };
  });
}

/* ── 이벤트 ── */
$('all').onclick = () => { document.querySelectorAll('#sets input').forEach(c=>{c.checked=true; c.closest('.set').classList.add('on');}); build(); };
$('none').onclick = () => { document.querySelectorAll('#sets input').forEach(c=>{c.checked=false; c.closest('.set').classList.remove('on');}); build(); };
$('yomiOff').addEventListener('change', e => { $('yomiWrap').classList.toggle('on', e.target.checked); build(); });
$('round').addEventListener('change', build);

$('copy').onclick = async () => {
  const url = build();
  try{ await navigator.clipboard.writeText(url); msg('주소를 복사했습니다.'); }
  catch(e){
    const r = document.createRange(); r.selectNode($('url'));
    getSelection().removeAllRanges(); getSelection().addRange(r);
    msg('주소가 선택되었습니다. Ctrl+C 로 복사하세요.');
  }
};
$('open').onclick = () => window.open(build(), '_blank');
$('save').onclick = () => {
  const sel = picked();
  const name = prompt('이 조합의 이름 (예: 4차시 ないで)', sel.length === 1 ? sel[0] : '');
  if(!name) return;
  const l = load();
  l.push({ name, sets: sel, yomi: $('yomiOff').checked, n: $('round').value });
  store(l); drawSaved(); msg('「' + name + '」 으로 저장했습니다.');
};

/* ── 시작 ── */
(async () => {
  drawSets(await collect());
  drawSaved();
  build();
})();
</script>
</body>
</html>
