<!--
  ┌──────────────────────────────────────────────────────────────┐
  │  설정: 아래 SHEET_CSV_URL 한 줄만 바꾸면 됩니다.              │
  │                                                              │
  │  1. 구글 시트에 카드 목록을 만듭니다.                        │
  │     (동봉한 카드목록.csv 를 그대로 가져오기 하면 됩니다)     │
  │  2. 파일 > 공유 > 웹에 게시 > 시트 선택 > 쉼표로 구분된 값   │
  │  3. 나온 주소를 아래에 붙여넣습니다.                         │
  │                                                              │
  │  비워 두면 이 파일에 내장된 5과 카드로 동작합니다.           │
  │                                                              │
  │  ROUND_SIZE 는 한 판에 뽑을 카드 장수입니다.                  │
  │    카드가 아무리 많아도 한 판은 이 장수만큼만 돌고,           │
  │    「다시 섞기」를 누르면 다른 카드가 나옵니다.                │
  │                                                              │
  │  사진: 시트의 img 열에 주소를 적으면 카드에 사진이 붙습니다.  │
  │        같은 저장소에 img 폴더를 만들어 두고                   │
  │        img/monja.jpg 처럼 적는 것을 권합니다.                 │
  │        비워 두면 글자만 있는 카드가 됩니다.                   │
  │        사진은 세로 2:3 비율로 맞춰 주세요.                     │
  │        (바꾸려면 아래 CSS 의 aspect-ratio:2/3 을 고치세요)     │
  │                                                              │
  │  두 장 뽑기 문장은 세트마다 바꿀 수 있습니다.                 │
  │    type 에 template 이라고 적은 줄을 한 줄 넣고,              │
  │    jp   = 문장 틀   (예: これ、{B}じゃなくて {A}です。)        │
  │    yomi = 발음 틀   (예: 코레, {b}쟈나쿠테 {a}데스)            │
  │    ko   = 화면 탭 이름                                        │
  │    answer = 카드 위 라벨 두 개, | 로 구분 (예: 주문|나온 것)   │
  │  두 더미는 type 을 a / b 로 적어도 됩니다.                    │
  │                                                              │
  │  한 장 뽑기 문장도 세트마다 바꿀 수 있습니다.                 │
  │    type 에 template1 이라고 적은 줄을 한 줄 넣고,             │
  │    jp   = 문장 틀   ({A}=카드, {B}=그 카드의 answer)          │
  │    yomi = 발음 틀   ({a} {b})                                 │
  │    ko   = 탭 이름                                             │
  │    answer = 카드 위에 뜰 안내 문구                            │
  │  도구 더미(b)가 없으면 두 장 뽑기 탭은 자동으로 숨습니다.     │
  └──────────────────────────────────────────────────────────────┘
-->

  const SHEET_CSV_URL = '';

  /* 주소 뒤에 붙이는 설정 — 교사용 페이지(teacher.html)에서 자동으로 만들어 줍니다
     ?set=ないで          해당 글자가 든 세트만 보이기 (여러 개는 쉼표로)
     ?yomi=off            발음을 숨긴 채로 시작
     ?n=6                 한 판에 뽑을 장수 바꾸기                            */
  const URLOPT = new URLSearchParams(location.search);
  const ONLY = (URLOPT.get('set') || '').split(',').map(v=>v.trim()).filter(Boolean);
  const ROUND = parseInt(URLOPT.get('n'), 10) || ROUND_SIZE;
</script>

/* ── CSV 파싱 (따옴표 있는 칸 처리) ─────────────── */
function parseCSV(text){
  const out=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); out.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c;
  }
  if(cell.length||row.length){ row.push(cell); out.push(row); }
  return out.filter(r=>r.some(v=>v.trim()!==''));
}

async function load(){
  if(SHEET_CSV_URL){
    try{
      const res = await fetch(SHEET_CSV_URL);
      if(!res.ok) throw new Error(res.status);
      const table = parseCSV(await res.text());
      const head = table[0].map(h=>h.trim().toLowerCase());
      const idx = n => head.indexOf(n);
      const body = table.slice(1)
        .map(r=>[r[idx('set')],r[idx('type')],r[idx('jp')],r[idx('yomi')],r[idx('ko')],r[idx('answer')],r[idx('img')]])
        .map(r=>r.map(v=>(v||'').trim()))
        .filter(r=>r[0]&&r[2]);
      if(!body.length) throw new Error('빈 시트');
      rows = body;
      note.textContent = '시트에서 카드 ' + rows.length + '장을 불러왔습니다.';
    }catch(e){
      rows = BUILTIN;
      note.innerHTML = '<span class="err">시트를 불러오지 못했습니다.</span> 내장 카드로 진행합니다. 시트가 “웹에 게시”되어 있는지, 주소가 CSV 형식인지 확인해 주세요.';
    }
  } else {
    rows = BUILTIN;
    note.textContent = '내장 카드로 동작 중입니다. 파일 상단의 SHEET_CSV_URL에 시트 주소를 넣으면 카드를 시트에서 관리할 수 있습니다.';
  }
  let sets=[...new Set(rows.map(r=>r[0]))];
  if(ONLY.length){
    const picked = sets.filter(s => ONLY.some(k => s.includes(k)));
    if(picked.length) sets = picked;
  }
  // 걸러진 세트의 카드만 남긴다
  rows = rows.filter(r => sets.includes(r[0]));
  setSel.innerHTML = sets.map(s=>`<option>${s}</option>`).join('');
  setSel.style.display = sets.length > 1 ? '' : 'none';
  setName = sets[0];
  reset();
}

const hasAnswers = () => pileA().some(r=>r[5] && !r[5].includes('::'));
const pileTags = () => { const t=tmpl(); const parts=(t&&t[5]||'').split('|'); return [ (parts[0]||'').trim(), (parts[1]||'').trim() ]; };
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };

// answer(6번째 값)에 '::' 이 있으면 "힌트::문장조각::발음" 형식으로 보고 그걸 쓰고,
// 없으면 카드 자체(jp/yomi)를 그대로 쓴다.
function pieceOf(card){
  const raw = (card && card[5]) || '';
  const parts = raw.split('::');
  if(parts.length >= 3) return { hint: parts[0].trim(), jp: parts[1].trim(), yomi: parts[2].trim() };
  if(parts.length === 2) return { hint: '', jp: parts[0].trim(), yomi: parts[1].trim() };
  return { hint: '', jp: card[2], yomi: card[3] };
}

// 한 장 뽑기 문장. {A}=카드, {B}=그 카드의 정답
function buildSentence1(card){
  const t = tmpl1();
  const jpT = t ? t[2] : '{B}で 食べるんだよ。';
  const yoT = t ? t[3] : '{b}데 다베룬다요';
  const [B, bGiven] = ansParts(card);
  const b = bGiven || yomiOf(B) || yomiInA(B);
  const fill = (str, map) => str.replace(/\{([AaBb])\}/g, (_, k) => map[k] || '');
  return {
    jp: fill(jpT, { A:card[2], B }),
    yomi: fill(yoT, { a:card[3], b })
  };
}

// 두 장 뽑기 문장. {A}{B}=일본어, {a}{b}=한글 발음
// 템플릿에 {B}가 없으면 A만으로 질문을 만들고, B(대답 카드)는 그 자체를 두 번째 줄로 보여 준다.
function buildSentence(a, b){
  const t = tmpl();
  const jpT = t ? t[2] : '{A}は {B}で 食べるんだよ。';
  const yoT = t ? t[3] : '{a}와 {b}데 다베룬다요';
  const pa = pieceOf(a), pb = pieceOf(b);
  const fill = (str, map) => str.replace(/\{([AaBb])\}/g, (_, k) => map[k] || '');
  if(!/\{B\}/.test(jpT)){
    return {
      twoLine: true,
      line1: fill(jpT, { A:pa.jp, a:pa.yomi }),
      line1y: fill(yoT, { a:pa.yomi }),
      line2: pb.jp,
      line2y: pb.yomi
    };
  }
  return {
    twoLine: false,
    jp: fill(jpT, { A:pa.jp, B:pb.jp }),
    yomi: fill(yoT, { a:pa.yomi, b:pb.yomi })
  };
}
const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function reset(){
  const all = shuffle(pileA());
  roundTotal = Math.min(ROUND, all.length);
  deck = all.slice(0, roundTotal);
  current = null; revealed = false; quizHint = false;
  mixFood = mixTool = mixJudged = null; mixHint = false;
  render();
}

function stripHTML(card, opts={}){
  const src = (card[6] || '').trim();
  const cls = (opts.small ? 'strip small' : 'strip') + (src ? ' has-photo' : '');
  const tag = opts.tag ? `<div class="tag">${esc(opts.tag)}</div>` : '';
  const stamp = opts.stamp ? `<div class="stamp press">${esc(opts.stamp)}</div>` : '';
  const photo = src ? `<img class="photo" src="${esc(src)}" alt="" onerror="this.remove()">` : '';
  return `<div class="${cls}">${tag}${photo}
    <div class="jp">${esc(card[2])}</div>
    <div class="yomi">${esc(card[3])}</div>
    <div class="gloss">${esc(card[4])}</div>${stamp}</div>`;
}

/* ── 화면 그리기 ───────────────────────────────── */
function render(){
  const quizTab = document.getElementById('tab-quiz');
  const mixTab = document.getElementById('tab-mix');
  const t = tmpl();
  const quizOK = hasAnswers();
  quizTab.style.display = quizOK ? '' : 'none';
  const t1 = tmpl1();
  quizTab.textContent = t1 && t1[4] ? t1[4] : '먹는 법 퀴즈';
  mixTab.textContent = t && t[4] ? t[4] : '도구 뽑기';
  const mixOK = pileB().length > 0;
  mixTab.style.display = mixOK ? '' : 'none';
  if(!quizOK) mode = 'mix';
  if(!mixOK) mode = 'quiz';
  quizTab.setAttribute('aria-selected', mode==='quiz');
  mixTab.setAttribute('aria-selected', mode==='mix');
  mode==='quiz' ? renderQuiz() : renderMix();
}

const promptOf = () => { const t = tmpl1(); return (t && t[5]) ? t[5] : 'これ、どうやって 食べるの？'; };

// 정답 칸 맨 앞에 {{힌트}} 를 붙이면 힌트 버튼에서만 보여 주고, 나머지는 그대로 읽는다.
// 그 다음은 "일본어" 또는 "일본어|한글발음" 두 가지 형태를 받는다.
function splitHint(raw){
  const m = raw.match(/^\{\{(.*?)\}\}/);
  return m ? { hint: m[1].trim(), rest: raw.slice(m[0].length) } : { hint: '', rest: raw };
}
const hintOf = card => splitHint((card && card[5]) || '').hint;
const ansParts = card => {
  const { rest } = splitHint((card && card[5]) || '');
  const i = rest.indexOf('|');
  return i < 0 ? [rest, ''] : [rest.slice(0, i).trim(), rest.slice(i + 1).trim()];
};

// 정답이 같은 더미 안의 다른 카드를 가리키면 '짝' 세트로 본다
const partnerOf = card => { const a = ansParts(card)[0]; return a ? pileA().find(r=>r[2]===a) : null; };

// 문장 틀에서 카드 사이/뒤에 오는 말을 뽑아 카드 위 라벨로 쓴다
// 예: 「これ、{B}じゃなくて {A}です。」 → ['じゃなくて', 'です。']
function pairLabels(){
  const t = tmpl1();
  if(!t) return null;
  const jp = t[2] || '';
  const order = [];
  jp.replace(/\{([AB])\}/g, (m, k) => { order.push(k); return m; });
  if(order.length < 2) return null;
  const parts = jp.split(/\{[AB]\}/);
  return { order, mid: (parts[1]||'').trim(), post: (parts[2]||'').trim() };
}

function renderQuiz(){
  const total = roundTotal;
  const done = total - deck.length - (current?1:0);

  if(!current && !deck.length && total){
    stage.innerHTML = `<div class="placeholder">카드 ${total}장을 모두 돌았습니다.<br>다시 섞으면 다른 카드가 나와요.</div>`;
    controls.innerHTML = `<button class="btn shu" id="again">다시 섞기</button>`;
    document.getElementById('again').onclick = reset;
    return;
  }
  if(!current){
    stage.innerHTML = `<div class="counter">이번 판 ${total}장 · 전체 ${pileA().length}장 중에서</div>
      <div class="placeholder">${partnerOf(deck[deck.length-1]) ? '두 장을 나란히 뽑습니다.<br>고쳐 말해 보세요.' : '카드를 뽑아 짝에게 보여 주세요.<br>' + esc(promptOf())}</div>`;
    controls.innerHTML = `<button class="btn" id="draw">카드 뽑기</button>`;
    document.getElementById('draw').onclick = () => { current = deck.pop(); revealed = false; quizHint = false; render(); };
    return;
  }

  const answerRaw = ansParts(current)[0];
  const answer = answerRaw.length <= 6 ? answerRaw : '';
  const sent = buildSentence1(current);
  const partner = partnerOf(current);
  const L = partner ? pairLabels() : null;
  const hint = hintOf(current);
  const showHint = !partner && hint && !revealed;

  if(partner && L){
    // 짝 세트 : 두 장을 나란히 보여 준다
    const first  = L.order[0] === 'A' ? current : partner;
    const second = L.order[0] === 'A' ? partner : current;
    stage.innerHTML = `<div class="counter">${done + 1} / ${total}</div>
      <div class="strip-row">
        ${stripHTML(first,  { small:true, tag:L.mid })}
        ${stripHTML(second, { small:true, tag:L.post })}
      </div>
      ${revealed ? `<div class="sentence">${esc(sent.jp)}
        <span class="s-yomi">${esc(sent.yomi)}</span></div>` : ''}`;
  } else {
    stage.innerHTML = `<div class="counter">${done + 1} / ${total}</div>
      ${stripHTML(current, { tag: promptOf(), stamp: revealed ? answer : '' })}
      ${showHint && quizHint ? `<div class="hint">${esc(hint)}</div>` : ''}
      ${revealed ? `<div class="sentence">${esc(sent.jp)}
        <span class="s-yomi">${esc(sent.yomi)}</span></div>` : ''}`;
  }

  const hintBtn = showHint ? `<button class="btn ghost" id="qhint">${quizHint ? '힌트 숨기기' : '힌트 보기'}</button>` : '';
  controls.innerHTML = revealed
    ? `<button class="btn" id="next">${deck.length ? '다음 카드' : '결과 보기'}</button>
       <button class="btn ghost" id="reshuffle">처음부터</button>`
    : hintBtn + `<button class="btn shu" id="flip">${partner ? '문장 확인' : '뒤집어서 확인'}</button>`;

  if(revealed){
    document.getElementById('next').onclick = () => { current = deck.length ? deck.pop() : null; revealed = false; quizHint = false; if(!deck.length && !current) current=null; render(); };
    document.getElementById('reshuffle').onclick = reset;
  } else {
    document.getElementById('flip').onclick = () => { revealed = true; render(); };
    if(showHint) document.getElementById('qhint').onclick = () => { quizHint = !quizHint; render(); };
  }
}

function renderMix(){
  const tags = pileTags();
  if(!mixFood){
    stage.innerHTML = `<div class="placeholder">두 장을 한 번에 뽑습니다.<br>나온 문장을 말해 보세요.</div>`;
    controls.innerHTML = `<button class="btn" id="spin">두 장 뽑기</button>`;
    document.getElementById('spin').onclick = spin;
    return;
  }

  const judgeMode = hasAnswers();
  const ok = mixFood[5] === mixTool[2];
  const sent = buildSentence(mixFood, mixTool);
  const showSentence = judgeMode || mixJudged !== null;
  const pa = pieceOf(mixFood);
  const showHint = !judgeMode && pa.hint && mixJudged === null;

  const sentenceHTML = !showSentence ? '' :
    sent.twoLine
      ? `<div class="sentence">${esc(sent.line1)}<span class="s-yomi">${esc(sent.line1y)}</span></div>
         <div class="sentence">${esc(sent.line2)}<span class="s-yomi">${esc(sent.line2y)}</span></div>`
      : `<div class="sentence">${esc(sent.jp)}<span class="s-yomi">${esc(sent.yomi)}</span></div>`;

  stage.innerHTML = `
    <div class="strip-row">
      ${stripHTML(mixFood,{small:true, tag:tags[0]})}
      ${stripHTML(mixTool,{small:true, tag:tags[1]})}
    </div>
    ${showHint && mixHint ? `<div class="hint">${esc(pa.hint)}</div>` : ''}
    ${sentenceHTML}
    <div class="verdict ${judgeMode && mixJudged !== null ? (mixJudged===ok?'ok':'no') : ''}">${
      !judgeMode || mixJudged === null ? '' :
      (mixJudged === ok
        ? (ok ? 'ほんとう！ <small>혼토- · 맞는 조합이에요</small>' : 'うそ！ <small>우소 · 맞아요, 말이 안 되죠</small>')
        : (ok ? 'あれ？ <small>아레 · 사실 이건 맞는 조합이에요</small>' : 'あれ？ <small>아레 · 이건 좀 이상한데요</small>'))
    }</div>`;

  if(judgeMode){
    controls.innerHTML = mixJudged === null
      ? `<button class="btn two" id="hon">ほんとう？<span>혼토-</span></button>
         <button class="btn shu two" id="uso">うそ！<span>우소</span></button>`
      : `<button class="btn" id="spin2">다시 뽑기</button>`;
    if(mixJudged === null){
      document.getElementById('hon').onclick = () => { mixJudged = true; render(); };
      document.getElementById('uso').onclick = () => { mixJudged = false; render(); };
    } else {
      document.getElementById('spin2').onclick = spin;
    }
  } else {
    const hintBtn = showHint ? `<button class="btn ghost" id="hint">${mixHint ? '힌트 숨기기' : '힌트 보기'}</button>` : '';
    controls.innerHTML = mixJudged === null
      ? hintBtn + `<button class="btn shu" id="reveal">문장 확인</button>`
      : `<button class="btn" id="spin2">다시 뽑기</button>`;
    if(mixJudged === null){
      document.getElementById('reveal').onclick = () => { mixJudged = true; render(); };
      if(showHint) document.getElementById('hint').onclick = () => { mixHint = !mixHint; render(); };
    } else {
      document.getElementById('spin2').onclick = spin;
    }
  }
}

function spin(){
  const f = pileA(), t = pileB();
  const r = a => a[Math.floor(Math.random()*a.length)];
  mixFood = r(f); mixTool = r(t);
  // 같은 것이 두 장 나오면 문장이 성립하지 않으므로 다시 뽑음
  let guard = 0;
  while(mixFood[2] === mixTool[2] && t.length > 1 && guard++ < 20) mixTool = r(t);
  mixJudged = null; mixHint = false;
  render();
}

/* ── 이벤트 ───────────────────────────────────── */
document.getElementById('tab-quiz').onclick = () => { mode='quiz'; render(); };
document.getElementById('tab-mix').onclick  = () => { mode='mix';  render(); };
setSel.onchange = e => { setName = e.target.value; reset(); };
document.getElementById('yomiBtn').onclick = e => {
  const on = document.body.classList.toggle('hide-yomi') === false;
  e.currentTarget.setAttribute('aria-pressed', on);
  e.currentTarget.textContent = on ? '발음 숨기기' : '발음 보기';
};

if(URLOPT.get('yomi') === 'off'){
  document.body.classList.add('hide-yomi');
  const b = document.getElementById('yomiBtn');
  b.setAttribute('aria-pressed', 'false');
  b.textContent = '발음 보기';
}

load();
</script>
