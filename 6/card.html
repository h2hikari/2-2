function parseCSV(text){
  const out=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"') q=true;
    else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'){row.push(cell);out.push(row);row=[];cell='';}
    else if(c!=='\r') cell+=c;
  }
  if(cell.length||row.length){row.push(cell);out.push(row);}
  return out.filter(r=>r.some(v=>v.trim()!==''));
}

async function load(){
  if(SHEET_CSV_URL){
    try{
      const res=await fetch(SHEET_CSV_URL);if(!res.ok)throw new Error(res.status);
      const table=parseCSV(await res.text());const head=table[0].map(h=>h.trim().toLowerCase());
      const idx=n=>head.indexOf(n);
      const body=table.slice(1).map(r=>[r[idx('set')],r[idx('type')],r[idx('jp')],r[idx('yomi')],r[idx('ko')],r[idx('answer')],r[idx('img')]]).map(r=>r.map(v=>(v||'').trim())).filter(r=>r[0]&&r[2]);
      if(!body.length)throw new Error('빈 시트');rows=body;
      note.textContent='시트에서 카드 '+rows.length+'장을 불러왔습니다.';
    }catch(e){rows=BUILTIN;note.innerHTML='<span class="err">시트를 불러오지 못했습니다.</span> 내장 카드로 진행합니다.';}
  }else{rows=BUILTIN;note.textContent='내장 카드로 동작 중입니다.';}
  let sets=[...new Set(rows.map(r=>r[0]))];
  if(ONLY.length){const picked=sets.filter(s=>ONLY.some(k=>s.includes(k)));if(picked.length)sets=picked;}
  rows=rows.filter(r=>sets.includes(r[0]));
  setSel.innerHTML=sets.map(s=>`<option>${s}</option>`).join('');
  setSel.style.display=sets.length>1?'':'none';setName=sets[0];reset();
}

const A_TYPES=['food','a','pile1'];const B_TYPES=['tool','b','pile2'];

const yomiInA=jp=>{const t=pileA().find(r=>r[2]===jp);return t?t[3]:'';};

const pileTags=()=>{const t=tmpl();const parts=(t&&t[5]||'').split('|');return[(parts[0]||'').trim(),(parts[1]||'').trim()];};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const yomiOf=jp=>{const t=pileB().find(r=>r[2]===jp);return t?t[3]:'';};
function pieceOf(card){const raw=(card&&card[5])||'';const parts=raw.split('::');if(parts.length>=3)return{hint:parts[0].trim(),jp:parts[1].trim(),yomi:parts[2].trim()};if(parts.length===2)return{hint:'',jp:parts[0].trim(),yomi:parts[1].trim()};return{hint:'',jp:card[2],yomi:card[3]};}
function buildSentence1(card){const t=tmpl1();const jpT=t?t[2]:'{B}で 食べるんだよ。';const yoT=t?t[3]:'{b}데 다베룬다요';const[B,bGiven]=ansParts(card);const b=bGiven||yomiOf(B)||yomiInA(B);const fill=(str,map)=>str.replace(/\{([AaBb])\}/g,(_,k)=>map[k]||'');return{jp:fill(jpT,{A:card[2],B}),yomi:fill(yoT,{a:card[3],b})};}
function buildSentence(a,b){const t=tmpl();const jpT=t?t[2]:'{A}は {B}で 食べるんだよ。';const yoT=t?t[3]:'{a}와 {b}데 다베룬다요';const pa=pieceOf(a),pb=pieceOf(b);const fill=(str,map)=>str.replace(/\{([AaBb])\}/g,(_,k)=>map[k]||'');if(!/\{B\}/.test(jpT)){return{twoLine:true,line1:fill(jpT,{A:pa.jp,a:pa.yomi}),line1y:fill(yoT,{a:pa.yomi}),line2:pb.jp,line2y:pb.yomi};}return{twoLine:false,jp:fill(jpT,{A:pa.jp,B:pb.jp}),yomi:fill(yoT,{a:pa.yomi,b:pb.yomi})};}
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const jpHTML=s=>esc(s).replace(/([一-龯々]+)\(([ぁ-ゖァ-ヺー]+)\)/g,'<ruby>$1<rt>$2</rt></ruby>');

function reset(){const all=shuffle(pileA());roundTotal=Math.min(ROUND,all.length);deck=all.slice(0,roundTotal);current=null;revealed=false;quizHint=false;mixFood=mixTool=mixJudged=null;mixHint=false;render();}

function stripHTML(card,opts={}){const src=(card[6]||'').trim();const cls=(opts.small?'strip small':'strip')+(src?' has-photo':'');const tag=opts.tag?`<div class="tag">${esc(opts.tag)}</div>`:'';const stamp=opts.stamp?`<div class="stamp press">${esc(opts.stamp)}</div>`:'';const photo=src?`<img class="photo" src="${esc(src)}" alt="" onerror="this.remove()">`:'';const ox=card[2]==='○'||card[2]==='×';return`<div class="${cls}">${tag}${photo}<div class="jp${ox?' ox':''}">${jpHTML(card[2])}</div><div class="yomi">${esc(card[3])}</div><div class="gloss">${esc(card[4])}</div>${stamp}</div>`;}

function render(){const quizTab=document.getElementById('tab-quiz');const mixTab=document.getElementById('tab-mix');const t=tmpl();const quizOK=hasAnswers();quizTab.style.display=quizOK?'':'none';const t1=tmpl1();quizTab.textContent=t1&&t1[4]?t1[4]:'먹는 법 퀴즈';mixTab.textContent=t&&t[4]?t[4]:'도구 뽑기';const mixOK=pileB().length>0;mixTab.style.display=mixOK?'':'none';if(!quizOK)mode='mix';if(!mixOK)mode='quiz';quizTab.setAttribute('aria-selected',mode==='quiz');mixTab.setAttribute('aria-selected',mode==='mix');mode==='quiz'?renderQuiz():renderMix();}

const promptOf=()=>{const t=tmpl1();return(t&&t[5])?t[5]:'これ、どうやって 食べるの？';};
function splitHint(raw){const m=raw.match(/^\{\{(.*?)\}\}/);return m?{hint:m[1].trim(),rest:raw.slice(m[0].length)}:{hint:'',rest:raw};}
const hintOf=card=>{const raw=(card&&card[5])||'';if(raw.includes('::'))return raw.split('::')[0].trim();return splitHint(raw).hint;};
const ansParts=card=>{const{rest:raw}=splitHint((card&&card[5])||'');const i=raw.indexOf('|');return i<0?[raw,'']:[raw.slice(0,i).trim(),raw.slice(i+1).trim()];};
const partnerOf=card=>{const a=ansParts(card)[0];return a?pileA().find(r=>r[2]===a):null;};
function pairLabels(){const t=tmpl1();if(!t)return null;const jp=t[2]||'';const order=[];jp.replace(/\{([AB])\}/g,(m,k)=>{order.push(k);return m;});if(order.length<2)return null;const parts=jp.split(/\{[AB]\}/);return{order,mid:(parts[1]||'').trim(),post:(parts[2]||'').trim()};}

function renderQuiz(){
  const total=roundTotal;const done=total-deck.length-(current?1:0);
  if(!current&&!deck.length&&total){stage.innerHTML=`<div class="placeholder">카드 ${total}장을 모두 돌았습니다.<br>다시 섞으면 다른 카드가 나와요.</div>`;controls.innerHTML=`<button class="btn shu" id="again">다시 섞기</button>`;document.getElementById('again').onclick=reset;return;}
  if(!current){stage.innerHTML=`<div class="counter">이번 판 ${total}장 · 전체 ${pileA().length}장 중에서</div><div class="placeholder">${partnerOf(deck[deck.length-1])?'두 장을 나란히 뽑습니다.<br>고쳐 말해 보세요.':'카드를 뽑아 짝에게 보여 주세요.<br>'+esc(promptOf())}</div>`;controls.innerHTML=`<button class="btn" id="draw">카드 뽑기</button>`;document.getElementById('draw').onclick=()=>{current=deck.pop();revealed=false;quizHint=false;render();};return;}
  const answerRaw=ansParts(current)[0];const answer=answerRaw.length<=6?answerRaw:'';const sent=buildSentence1(current);const partner=partnerOf(current);const L=partner?pairLabels():null;const hint=hintOf(current);const showHint=!partner&&hint&&!revealed;
  if(partner&&L){const first=L.order[0]==='A'?current:partner;const second=L.order[0]==='A'?partner:current;stage.innerHTML=`<div class="counter">${done+1} / ${total}</div><div class="strip-row">${stripHTML(first,{small:true,tag:L.mid})}${stripHTML(second,{small:true,tag:L.post})}</div>${revealed?`<div class="sentence">${jpHTML(sent.jp)}<span class="s-yomi">${esc(sent.yomi)}</span></div>`:''}`;}
  else{stage.innerHTML=`<div class="counter">${done+1} / ${total}</div>${stripHTML(current,{tag:promptOf(),stamp:revealed?answer:''})}${showHint&&quizHint?`<div class="hint">${esc(hint)}</div>`:''}${revealed?`<div class="sentence">${jpHTML(sent.jp)}<span class="s-yomi">${esc(sent.yomi)}</span></div>`:''}`;}
  const hintBtn=showHint?`<button class="btn ghost" id="qhint">${quizHint?'힌트 숨기기':'힌트 보기'}</button>`:'';
  controls.innerHTML=revealed?`<button class="btn" id="next">${deck.length?'다음 카드':'결과 보기'}</button><button class="btn ghost" id="reshuffle">처음부터</button>`:hintBtn+`<button class="btn shu" id="flip">${partner?'문장 확인':'뒤집어서 확인'}</button>`;
  if(revealed){document.getElementById('next').onclick=()=>{current=deck.length?deck.pop():null;revealed=false;quizHint=false;if(!deck.length&&!current)current=null;render();};document.getElementById('reshuffle').onclick=reset;}
  else{document.getElementById('flip').onclick=()=>{revealed=true;render();};if(showHint)document.getElementById('qhint').onclick=()=>{quizHint=!quizHint;render();};}
}

function renderMix(){
  const tags=pileTags();
  if(!mixFood){stage.innerHTML=`<div class="placeholder">두 장을 한 번에 뽑습니다.<br>나온 문장을 말해 보세요.</div>`;controls.innerHTML=`<button class="btn" id="spin">두 장 뽑기</button>`;document.getElementById('spin').onclick=spin;return;}
  const judgeMode=hasAnswers();const ok=mixFood[5]===mixTool[2];const sent=buildSentence(mixFood,mixTool);const showSentence=judgeMode||mixJudged!==null;const pa=pieceOf(mixFood);const showHint=!judgeMode&&pa.hint&&mixJudged===null;
  const sentenceHTML=!showSentence?'':sent.twoLine?`<div class="sentence">${jpHTML(sent.line1)}<span class="s-yomi">${esc(sent.line1y)}</span></div><div class="sentence">${jpHTML(sent.line2)}<span class="s-yomi">${esc(sent.line2y)}</span></div>`:`<div class="sentence">${jpHTML(sent.jp)}<span class="s-yomi">${esc(sent.yomi)}</span></div>`;
  stage.innerHTML=`<div class="strip-row">${stripHTML(mixFood,{small:true,tag:tags[0]})}${stripHTML(mixTool,{small:true,tag:tags[1]})}</div>${showHint&&mixHint?`<div class="hint">${esc(pa.hint)}</div>`:''}${sentenceHTML}<div class="verdict ${judgeMode&&mixJudged!==null?(mixJudged===ok?'ok':'no'):''}">${!judgeMode||mixJudged===null?'':(mixJudged===ok?(ok?'ほんとう！ <small>혼토- · 맞는 조합이에요</small>':'うそ！ <small>우소 · 맞아요, 말이 안 되죠</small>'):(ok?'あれ？ <small>아레 · 사실 이건 맞는 조합이에요</small>':'あれ？ <small>아레 · 이건 좀 이상한데요</small>'))}</div>`;
  if(judgeMode){controls.innerHTML=mixJudged===null?`<button class="btn two" id="hon">ほんとう？<span>혼토-</span></button><button class="btn shu two" id="uso">うそ！<span>우소</span></button>`:`<button class="btn" id="spin2">다시 뽑기</button>`;if(mixJudged===null){document.getElementById('hon').onclick=()=>{mixJudged=true;render();};document.getElementById('uso').onclick=()=>{mixJudged=false;render();};}else{document.getElementById('spin2').onclick=spin;}}
  else{const hintBtn=showHint?`<button class="btn ghost" id="hint">${mixHint?'힌트 숨기기':'힌트 보기'}</button>`:'';controls.innerHTML=mixJudged===null?hintBtn+`<button class="btn shu" id="reveal">문장 확인</button>`:`<button class="btn" id="spin2">다시 뽑기</button>`;if(mixJudged===null){document.getElementById('reveal').onclick=()=>{mixJudged=true;render();};if(showHint)document.getElementById('hint').onclick=()=>{mixHint=!mixHint;render();};}else{document.getElementById('spin2').onclick=spin;}}
}

function spin(){const f=pileA(),t=pileB();const r=a=>a[Math.floor(Math.random()*a.length)];mixFood=r(f);mixTool=r(t);let guard=0;while(mixFood[2]===mixTool[2]&&t.length>1&&guard++<20)mixTool=r(t);mixJudged=null;mixHint=false;render();}

document.getElementById('tab-quiz').onclick=()=>{mode='quiz';render();};
document.getElementById('tab-mix').onclick=()=>{mode='mix';render();};
setSel.onchange=e=>{setName=e.target.value;reset();};
document.getElementById('yomiBtn').onclick=e=>{const on=document.body.classList.toggle('hide-yomi')===false;e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.textContent=on?'발음 숨기기':'발음 보기';};
if(URLOPT.get('yomi')==='off'){document.body.classList.add('hide-yomi');const b=document.getElementById('yomiBtn');b.setAttribute('aria-pressed','false');b.textContent='발음 보기';}
load();
</script>
