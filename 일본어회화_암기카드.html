<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일본어 회화 암기카드 &middot; 1과·2과</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2a3a;
    --ink-soft:#5c596e;
    --paper:#eef0e8;
    --paper-deep:#e3e6da;
    --card:#fcfbf6;
    --card-back:#fbeef1;
    --sakura:#e2748d;
    --sakura-deep:#c15271;
    --moss:#5e8267;
    --moss-deep:#456350;
    --gold:#bd9138;
    --gold-deep:#94701f;
    --line: rgba(43,42,58,0.14);
    --shadow: 0 18px 40px -18px rgba(43,42,58,0.35);
    --radius: 22px;
    --accent: var(--sakura);
    --accent-deep: var(--sakura-deep);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(226,116,141,0.10), transparent 60%),
      radial-gradient(1000px 500px at -10% 110%, rgba(94,130,103,0.10), transparent 55%),
      var(--paper);
    background-attachment: fixed;
    color:var(--ink);
    font-family:'Gowun Dodum', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 60px;
  }

  /* faint notebook grid on the page background */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(43,42,58,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(43,42,58,0.035) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events:none;
    z-index:0;
  }

  .app{ position:relative; z-index:1; width:100%; max-width: 620px; }

  /* ---------- Header ---------- */
  header.top{ text-align:center; margin-bottom:22px; }
  header.top .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:.16em;
    font-size:11.5px;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  header.top h1{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:900;
    font-size: clamp(26px, 6vw, 34px);
    margin: 6px 0 4px;
    color:var(--ink);
  }
  header.top h1 .accent-word{ color:var(--accent); transition: color .35s; }
  header.top p.desc{ margin:0; color:var(--ink-soft); font-size:14px; }

  /* ---------- Tabs (folder-tab style) ---------- */
  .tabs{
    display:flex;
    gap:6px;
    padding: 0 6px;
    position:relative;
  }
  .tab{
    flex:1;
    appearance:none;
    border:none;
    cursor:pointer;
    padding: 12px 8px 14px;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:14.5px;
    color:var(--ink-soft);
    background: #dfe1d6;
    border-radius: 14px 14px 0 0;
    position:relative;
    top:2px;
    transition: all .25s ease;
    text-align:center;
  }
  .tab .tab-sub{
    display:block;
    font-family:'Gowun Batang', serif;
    font-weight:400;
    font-size:11px;
    opacity:.75;
    margin-top:2px;
  }
  .tab[data-active="true"]{
    background:var(--card);
    color:var(--accent-deep);
    top:0;
    box-shadow: 0 -6px 16px -10px rgba(43,42,58,.25);
  }
  .tab-panel-wrap{
    background:var(--card);
    border-radius: 0 14px 18px 18px;
    box-shadow: var(--shadow);
    padding: 22px 20px 26px;
    border: 1px solid var(--line);
    border-top:none;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  select#sectionSelect{
    flex:1;
    min-width:160px;
    font-family:'Gowun Dodum', sans-serif;
    font-size:13.5px;
    padding:9px 12px;
    border-radius:12px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
  }
  .iconbtn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    width:38px; height:38px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:16px;
    transition: transform .15s ease, background .2s ease, color .2s ease;
  }
  .iconbtn:hover{ color:var(--accent-deep); border-color: var(--accent); }
  .iconbtn:active{ transform:scale(.92); }
  .iconbtn[aria-pressed="true"]{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .iconbtn.textbtn{
    width:auto;
    padding: 0 14px;
    font-family:'Gowun Dodum', sans-serif;
    font-weight:700;
    font-size:12.5px;
    white-space:nowrap;
  }

  .progress-row{
    display:flex; align-items:center; justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .progress-bar{
    height:5px; border-radius:3px; background:var(--paper-deep);
    overflow:hidden; flex:1; margin:0 10px;
  }
  .progress-bar > div{
    height:100%; background:var(--accent); border-radius:3px;
    transition: width .3s ease;
  }

  /* ---------- Card ---------- */
  .stage{ perspective: 1400px; margin: 6px 0 18px; }
  .card{
    position:relative;
    width:100%;
    min-height: 300px;
    border-radius: var(--radius);
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.2,.9,.25,1);
    cursor:pointer;
  }
  .card.flipped{ transform: rotateY(180deg); }
  .face{
    position:absolute; inset:0;
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
    border-radius: var(--radius);
    border:1.5px solid var(--line);
    display:flex; flex-direction:column;
    padding: 22px 24px 20px;
    box-shadow: 0 2px 0 rgba(43,42,58,0.04) inset;
  }
  .face.front{
    background: var(--card);
    justify-content:space-between;
  }
  .face.back{
    background: var(--card-back);
    transform: rotateY(180deg);
    justify-content:space-between;
  }
  /* two little "binder holes" like a real flashcard */
  .face::before, .face::after{
    content:"";
    position:absolute; top:14px;
    width:11px; height:11px;
    border-radius:50%;
    background: var(--paper);
    border:1.5px solid var(--line);
  }
  .face::before{ left:16px; }
  .face::after{ right:16px; }

  .badge-row{
    display:flex; justify-content:center; margin-top:6px;
  }
  .badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.04em;
    color:var(--accent-deep);
    background: rgba(226,116,141,0.12);
    border:1px solid rgba(226,116,141,0.35);
    padding:4px 12px;
    border-radius:999px;
    max-width: 88%;
    text-align:center;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .card-body{
    flex:1;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    gap:12px;
    padding: 8px 4px;
  }
  .jp-text{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size: clamp(19px, 5.6vw, 25px);
    line-height:1.5;
    color:var(--ink);
    word-break: keep-all;
  }
  .pron-text{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13.5px;
    color:var(--accent-deep);
    letter-spacing:.01em;
    transition: filter .3s ease, opacity .3s ease;
  }
  .pron-text.concealed{
    filter: blur(7px);
    opacity:.5;
  }
  .mean-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    color: var(--moss-deep);
    text-transform:uppercase;
  }
  .mean-text{
    font-family:'Gowun Batang', serif;
    font-weight:700;
    font-size: clamp(18px, 5.2vw, 23px);
    color:var(--ink);
    line-height:1.55;
  }
  .mini-jp{
    font-family:'Gowun Dodum', sans-serif;
    font-size:12.5px;
    color:var(--ink-soft);
    border-top:1px dashed var(--line);
    padding-top:10px;
    margin-top:2px;
  }

  .card-footer-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
  }
  .speak-btn{
    display:flex; align-items:center; gap:7px;
    border:none;
    background: var(--accent);
    color:#fff;
    font-family:'Gowun Dodum', sans-serif;
    font-weight:700;
    font-size:13px;
    padding:10px 16px;
    border-radius:999px;
    cursor:pointer;
    box-shadow: 0 8px 16px -8px var(--accent-deep);
    transition: transform .15s ease, filter .2s ease;
  }
  .speak-btn:hover{ filter:brightness(1.05); }
  .speak-btn:active{ transform:scale(.96); }
  .speak-btn.playing{ animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 8px 16px -8px var(--accent-deep);} 50%{ box-shadow:0 8px 22px -6px var(--accent-deep);} }
  .speak-btn[disabled]{ opacity:.4; cursor:not-allowed; box-shadow:none; }

  .flip-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    display:flex; align-items:center; gap:6px;
  }
  .flip-arrow{
    display:inline-flex;
    transition: transform .5s cubic-bezier(.2,.9,.25,1);
  }
  .card.flipped .flip-arrow{ transform: rotate(180deg) scaleX(-1); }

  /* ---------- Nav controls ---------- */
  .nav-row{
    display:flex; align-items:center; justify-content:center; gap:16px;
    margin-top:4px;
  }
  .navbtn{
    border:none;
    background:var(--ink);
    color:#fff;
    width:46px; height:46px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease, background .2s ease;
    box-shadow: 0 10px 18px -10px rgba(43,42,58,.5);
  }
  .navbtn:hover{ background:var(--accent-deep); }
  .navbtn:active{ transform:scale(.9); }
  .navbtn[disabled]{ opacity:.3; cursor:not-allowed; }
  .flipbtn{
    border:1.5px solid var(--accent);
    background:#fff;
    color:var(--accent-deep);
    font-family:'Gowun Dodum', sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:12px 22px;
    border-radius:999px;
    cursor:pointer;
    display:flex; align-items:center; gap:8px;
    transition: background .2s ease, color .2s ease, transform .15s ease;
  }
  .flipbtn:hover{ background:var(--accent); color:#fff; }
  .flipbtn:active{ transform:scale(.96); }

  footer.note{
    text-align:center;
    color:var(--ink-soft);
    font-size:11.5px;
    margin-top:22px;
    line-height:1.7;
    padding: 0 10px;
  }
  footer.note b{ color:var(--ink); }

  .kbd-hint{ display:none; }
  @media (min-width: 640px){
    .kbd-hint{ display:inline; }
  }

  @media (prefers-reduced-motion: reduce){
    .card, .flip-arrow, .navbtn, .speak-btn{ transition:none !important; animation:none !important; }
  }

  /* accent theming per tab */
  body[data-accent="sakura"]{ --accent:var(--sakura); --accent-deep:var(--sakura-deep); }
  body[data-accent="moss"]{ --accent:var(--moss); --accent-deep:var(--moss-deep); }
  body[data-accent="gold"]{ --accent:var(--gold); --accent-deep:var(--gold-deep); }
</style>
</head>
<body data-accent="sakura">
<div class="app">

  <header class="top">
    <div class="eyebrow">2학년 2학기 &middot; 일본어 회화</div>
    <h1>おぼえる<span class="accent-word">カード</span></h1>
    <p class="desc">문장을 보고, 발음을 확인하고, 소리 내어 들어본 뒤 &mdash; 화살표로 뜻을 확인하세요.</p>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div class="tab-panel-wrap">

    <div class="toolbar">
      <select id="sectionSelect"></select>
      <button class="iconbtn textbtn" id="pronToggleBtn" title="한글 발음표기 표시/숨기기" aria-pressed="false">발음보기</button>
      <button class="iconbtn" id="shuffleBtn" title="순서 섞기" aria-pressed="false">&#128256;</button>
      <button class="iconbtn" id="resetBtn" title="처음으로">&#8634;</button>
    </div>

    <div class="progress-row">
      <span id="counter">1 / 1</span>
      <div class="progress-bar"><div id="progressFill" style="width:0%"></div></div>
      <span id="sectionTag">&nbsp;</span>
    </div>

    <div class="stage">
      <div class="card" id="card">
        <div class="face front">
          <div class="badge-row"><span class="badge" id="badgeFront">&nbsp;</span></div>
          <div class="card-body">
            <div class="jp-text" id="jpText">&nbsp;</div>
            <div class="pron-text" id="pronText">&nbsp;</div>
          </div>
          <div class="card-footer-row">
            <button class="speak-btn" id="speakBtn">&#128266; <span>음성 듣기</span></button>
            <span class="flip-hint">뒤집기 <span class="flip-arrow">&#8635;</span></span>
          </div>
        </div>
        <div class="face back">
          <div class="badge-row"><span class="badge" id="badgeBack">해석</span></div>
          <div class="card-body">
            <div class="mean-label">뜻</div>
            <div class="mean-text" id="meanText">&nbsp;</div>
          </div>
          <div class="mini-jp" id="miniJp">&nbsp;</div>
        </div>
      </div>
    </div>

    <div class="nav-row">
      <button class="navbtn" id="prevBtn" title="이전 (←)">&#8592;</button>
      <button class="flipbtn" id="flipBtn"><span class="flip-arrow">&#8635;</span> 뜻 확인</button>
      <button class="navbtn" id="nextBtn" title="다음 (→)">&#8594;</button>
    </div>

  </div>

  <footer class="note">
    &#128172; <b>발음보기</b> 버튼으로 한글 발음표기를 보이거나 가릴 수 있어요 (안 보고 싶은 친구는 꺼두세요).<br>
    발음표기는 학습 편의를 위한 참고용이며, 정확한 발음은 음성 듣기 버튼으로 확인하세요.<br>
    음성은 기기의 일본어 음성 엔진(Web Speech API)을 사용합니다 &middot; 카드를 클릭해도 뒤집힙니다
    <span class="kbd-hint">&middot; 키보드 ← → 이동, Space 뒤집기</span>
  </footer>
</div>

const TAB_META = {"1과 문장": {"label": "1과 문장", "sub": "どうぞ よろしく", "accent": "sakura"}, "2과 문장": {"label": "2과 문장", "sub": "おはなみは どう？", "accent": "moss"}, "새단어": {"label": "새단어", "sub": "たんご", "accent": "gold"}};
const TAB_ORDER = ["1과 문장", "2과 문장", "새단어"];

let state = {
  tab: TAB_ORDER[0],
  sectionIndex: 0, // -1 means "전체"
  deck: [],        // current flat list of {jp,pron,mean,src}
  idx: 0,
  flipped: false,
  shuffled: false,
  showPron: false,
};

const el = (id) => document.getElementById(id);

function buildTabs(){
  const wrap = el('tabs');
  wrap.innerHTML = '';
  TAB_ORDER.forEach(name => {
    const meta = TAB_META[name];
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.dataset.tab = name;
    btn.dataset.active = (name === state.tab) ? 'true' : 'false';
    btn.innerHTML = meta.label + '<span class="tab-sub">' + meta.sub + '</span>';
    btn.addEventListener('click', () => switchTab(name));
    wrap.appendChild(btn);
  });
}

function switchTab(name){
  state.tab = name;
  state.sectionIndex = -1;
  state.shuffled = false;
  el('shuffleBtn').setAttribute('aria-pressed', 'false');
  document.body.setAttribute('data-accent', TAB_META[name].accent);
  document.querySelectorAll('.tab').forEach(b => {
    b.dataset.active = (b.dataset.tab === name) ? 'true' : 'false';
  });
  buildSectionSelect();
  rebuildDeck();
  renderCard();
}

function buildSectionSelect(){
  const sel = el('sectionSelect');
  sel.innerHTML = '';
  const optAll = document.createElement('option');
  optAll.value = -1;
  const total = DATA[state.tab].reduce((s,sec)=>s+sec.cards.length,0);
  optAll.textContent = '전체 보기 (' + total + '장)';
  sel.appendChild(optAll);
  DATA[state.tab].forEach((sec, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = (sec.title || ('구간 ' + (i+1))) + ' (' + sec.cards.length + ')';
    sel.appendChild(opt);
  });
  sel.value = state.sectionIndex;
  sel.onchange = () => {
    state.sectionIndex = parseInt(sel.value, 10);
    rebuildDeck();
    renderCard();
  };
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function rebuildDeck(){
  const sections = DATA[state.tab];
  let cards = [];
  if(state.sectionIndex === -1){
    sections.forEach(sec => { sec.cards.forEach(c => cards.push(Object.assign({}, c, {sectionTitle: sec.title}))); });
  } else {
    const sec = sections[state.sectionIndex];
    cards = sec.cards.map(c => Object.assign({}, c, {sectionTitle: sec.title}));
  }
  state.deck = state.shuffled ? shuffleArray(cards) : cards;
  state.idx = 0;
  state.flipped = false;
}

function renderCard(){
  const card = el('card');
  card.classList.remove('flipped');
  state.flipped = false;

  const total = state.deck.length;

    el('miniJp').textContent = '';
    el('badgeFront').textContent = '';
    el('counter').textContent = '0 / 0';
    el('progressFill').style.width = '0%';
    el('speakBtn').disabled = true;
    return;
  }
  const c = state.deck[state.idx];
  el('jpText').textContent = c.jp;
  el('pronText').textContent = c.pron;
  el('meanText').textContent = c.mean;
  el('miniJp').textContent = c.jp;
  el('badgeFront').textContent = c.src ? c.src : (c.sectionTitle || '');
  el('badgeFront').title = c.src ? c.src : (c.sectionTitle || '');
  el('counter').textContent = (state.idx+1) + ' / ' + total;
  el('progressFill').style.width = (((state.idx+1)/total)*100) + '%';
  el('sectionTag').textContent = c.sectionTitle ? shorten(c.sectionTitle, 18) : '';
  el('speakBtn').disabled = false;
  applyPronVisibility();

  el('prevBtn').disabled = (state.idx === 0);
  el('nextBtn').disabled = (state.idx === total-1);
}

function shorten(s, n){
  return s.length > n ? s.slice(0,n)+'…' : s;
}

function applyPronVisibility(){
  el('pronText').classList.toggle('concealed', !state.showPron);
}

function flipCard(){
  if(state.deck.length === 0) return;
  state.flipped = !state.flipped;
  el('card').classList.toggle('flipped', state.flipped);
}

function goPrev(){
  if(state.idx > 0){ state.idx--; renderCard(); }
}
function goNext(){
  if(state.idx < state.deck.length-1){ state.idx++; renderCard(); }
}

/* ---------- Speech ---------- */
let voicesCache = [];
function loadVoices(){
  voicesCache = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
} else {
  el('speakBtn').title = '이 브라우저는 음성 재생을 지원하지 않습니다';
}

function speakCurrent(){
  if(!('speechSynthesis' in window)) return;
  const c = state.deck[state.idx];
  if(!c) return;
  const text = c.jp.replace(/＿+/g, '');
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  const jaVoice = voicesCache.find(v => v.lang && v.lang.toLowerCase().startsWith('ja'));
  if(jaVoice) utter.voice = jaVoice;
  utter.rate = 0.92;
  const btn = el('speakBtn');
  btn.classList.add('playing');
  utter.onend = () => btn.classList.remove('playing');
  utter.onerror = () => btn.classList.remove('playing');
  window.speechSynthesis.speak(utter);
}

/* ---------- Events ---------- */
el('card').addEventListener('click', flipCard);
el('flipBtn').addEventListener('click', flipCard);
el('prevBtn').addEventListener('click', goPrev);
el('nextBtn').addEventListener('click', goNext);
el('resetBtn').addEventListener('click', () => { state.idx = 0; renderCard(); });
el('shuffleBtn').addEventListener('click', () => {
  state.shuffled = !state.shuffled;
  el('shuffleBtn').setAttribute('aria-pressed', state.shuffled ? 'true' : 'false');
  rebuildDeck();
  renderCard();
});
el('speakBtn').addEventListener('click', (e) => { e.stopPropagation(); speakCurrent(); });
el('pronToggleBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  state.showPron = !state.showPron;
  const btn = el('pronToggleBtn');
  btn.setAttribute('aria-pressed', state.showPron ? 'true' : 'false');
  btn.textContent = state.showPron ? '발음숨기기' : '발음보기';
  applyPronVisibility();
});

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowLeft') goPrev();
  else if(e.key === 'ArrowRight') goNext();
  else if(e.key === ' '){ e.preventDefault(); flipCard(); }
});

/* ---------- Init ---------- */
buildTabs();
buildSectionSelect();
rebuildDeck();
renderCard();
</script>
</body>
</html>
